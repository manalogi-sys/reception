<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTG-recorder</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f2f2f7;
      color: #1c1c1e;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
      width: 100%;
      max-width: 400px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-top: 0;
      margin-bottom: 8px;
    }
    p.subtitle {
      font-size: 13px;
      color: #8e8e93;
      margin-top: 0;
      margin-bottom: 24px;
    }
    #timer {
      font-size: 48px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      margin: 20px 0;
      color: #000000;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }
    button {
      width: 100%;
      padding: 16px;
      font-size: 17px;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-start {
      background-color: #34c759;
      color: #ffffff;
    }
    .btn-start:active {
      background-color: #2ca849;
    }
    .btn-stop {
      background-color: #ff3b30;
      color: #ffffff;
    }
    .btn-stop:active {
      background-color: #d70015;
    }
    button:disabled {
      background-color: #e5e5ea;
      color: #aeaeb2;
      cursor: not-allowed;
    }
    #status {
      margin-top: 24px;
      font-size: 14px;
      color: #636366;
      line-height: 1.4;
      min-height: 40px;
      word-break: break-all;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>MTG-recorder</h1>
  <p class="subtitle">ボタンを押して録音を開始・停止できます</p>
  
  <div id="timer">00:00</div>
  
  <div class="btn-group">
    <button id="startBtn" class="btn-start" onclick="startRecording()">録音開始</button>
    <button id="stopBtn" class="btn-stop" onclick="stopRecording()" disabled>録音終了・議事録作成</button>
  </div>
  
  <div id="status">準備完了</div>
</div>

<script>
  // ★ここに取得したGASのWeb API URLを貼り付けてください★
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzakhqUP8Zsxg1g7PSbW2ciADuKrbxbU8CwrQvoy0gP_G0tjxP8ByKLFGNG3N_22aIo/exec';

  let mediaRecorder;
  let audioChunks = [];
  let timerInterval;
  let seconds = 0;

  function updateTimer() {
    seconds++;
    const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
    const secs = String(seconds % 60).padStart(2, '0');
    document.getElementById('timer').innerText = `${mins}:${secs}`;
  }

  async function startRecording() {
    try {
      // マイクのアクセス権限を取得
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = [];
      
      // 対応するMIMEタイプの判定
      let options = {};
      if (MediaRecorder.isTypeSupported('audio/webm')) {
        options = { mimeType: 'audio/webm' };
      } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
        options = { mimeType: 'audio/mp4' };
      }

      mediaRecorder = new MediaRecorder(stream, options);

      mediaRecorder.ondataavailable = event => {
        if (event.data.size > 0) {
          audioChunks.push(event.data);
        }
      };

      mediaRecorder.start();

      // タイマーリセット & 開始
      seconds = 0;
      document.getElementById('timer').innerText = '00:00';
      timerInterval = setInterval(updateTimer, 1000);

      // ボタンとステータスの更新
      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;
      document.getElementById('status').innerText = '録音中...';
    } catch (err) {
      alert('マイクへのアクセスを許可してください: ' + err.message);
    }
  }

  function stopRecording() {
    if (!mediaRecorder) return;

    mediaRecorder.stop();
    clearInterval(timerInterval);

    // マイクのストリームを停止（録音マークを消す）
    mediaRecorder.stream.getTracks().forEach(track => track.stop());

    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
    document.getElementById('status').innerText = '音声データを処理・送信中...';

    mediaRecorder.onstop = async () => {
      const mimeType = mediaRecorder.mimeType || 'audio/webm';
      const audioBlob = new Blob(audioChunks, { type: mimeType });
      
      // BlobをBase64文字列に変換
      const reader = new FileReader();
      reader.readAsDataURL(audioBlob);
      reader.onloadend = async () => {
        const base64Data = reader.result.split(',')[1];
        
        const payload = {
          fileName: `recording_${Date.now()}.${mimeType.includes('mp4') ? 'mp4' : 'webm'}`,
          mimeType: mimeType,
          fileData: base64Data
        };

        try {
          // GASのWeb APIへPOST送信
          await fetch(GAS_URL, {
            method: 'POST',
            mode: 'no-cors', // GASのCORS制約を回避するための設定
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          document.getElementById('status').innerText = '送信完了！議事録を作成中です。（完成するとGoogleドライブに保存されます）';
        } catch (error) {
          document.getElementById('status').innerText = '送信失敗: ' + error.message;
        }
      };
    };
  }
</script>

</body>
</html>
