<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>過去データ検索・閲覧</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8f9fa; padding: 15px; color: #333; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 25px 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; font-size: 20px; font-weight: 700; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 13px; color: #4a5568; }
        input[type="date"], input[type="text"], input[type="number"] { width: 100%; padding: 10px; background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .date-range { display: flex; gap: 8px; align-items: center; }
        .search-btn { width: 100%; background-color: #3182ce; color: white; border: none; padding: 12px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        .search-btn:disabled { background-color: #cbd5e0; cursor: not-allowed; }
        #loading { display: none; text-align: center; margin-top: 15px; font-weight: bold; color: #4a5568; }
        
        /* 検索結果リスト */
        .result-list { margin-top: 20px; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 10px; border-bottom: 1px solid #e2e8f0; }
        .item-info { flex: 1; padding-right: 10px; }
        .item-date { font-size: 11px; color: #718096; }
        .item-title { font-size: 14px; font-weight: bold; color: #2d3748; margin-top: 2px; }
        .btn-group { display: flex; gap: 6px; }
        .detail-btn { background-color: #b794f4; color: white; border: none; padding: 8px 10px; font-size: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; white-space: nowrap; }
        .exhibit-btn { background-color: #dd6b20; color: white; border: none; padding: 8px 10px; font-size: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; white-space: nowrap; }
        
        /* モーダル */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 90%; max-width: 450px; max-height: 85vh; overflow-y: auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); position: relative; box-sizing: border-box; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 24px; font-weight: bold; color: #a0aec0; cursor: pointer; }
        
        /* 詳細表示スタイル */
        .result-title { font-size: 18px; font-weight: bold; color: #2d3748; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 15px; }
        .result-item { margin-bottom: 18px; }
        .result-label { font-size: 12px; color: #4a5568; font-weight: bold; background: #edf2f7; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-bottom: 6px; }
        .result-value { font-size: 15px; color: #1a202c; font-weight: 500; line-height: 1.6; white-space: pre-wrap; }
        .price-highlight { font-size: 22px; color: #e53e3e; font-weight: bold; }
        #marketBtn { display: block; width: 100%; text-align: center; box-sizing: border-box; background-color: #38a169; color: white; text-decoration: none; padding: 12px; font-size: 15px; font-weight: bold; border-radius: 8px; margin-top: 15px; }
        
        /* 送信ボタン */
        .submit-btn { width: 100%; background-color: #38a169; color: white; border: none; padding: 12px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; }
        .submit-btn:disabled { background-color: #cbd5e0; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h2>過去データ検索・閲覧</h2>
    
    <div class="form-group">
        <label>📅 期間・日付指定</label>
        <div class="date-range">
            <input type="date" id="startDate">
            <span>〜</span>
            <input type="date" id="endDate">
        </div>
    </div>
    
    <div class="form-group">
        <label>🔍 商品名（キーワード）</label>
        <input type="text" id="keyword" placeholder="例: ヴィトン、ロレックス">
    </div>
    
    <button class="search-btn" id="searchBtn" onclick="executeSearch()">データ抽出</button>
    
    <div id="loading">検索中...</div>

    <div class="result-list" id="resultList"></div>
</div>

<!-- 詳細モーダル -->
<div class="modal" id="detailModal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('detailModal')">&times;</span>
        <div class="result-title">📊 分析結果詳細</div>
        
        <div class="result-item">
            <div class="result-label">特定された商品名</div>
            <div class="result-value" id="res-name" style="font-weight: bold;">-</div>
        </div>

        <div class="result-item">
            <div class="result-label" style="background-color: #feebc8; color: #c05621;">💡 買取専門店向けアドバイス</div>
            <div class="result-value" id="res-purchase-advice">-</div>
        </div>

        <hr style="border: 0; border-top: 1px dashed #e2e8f0; margin: 20px 0;">

        <div class="result-item">
            <div class="result-label">ヤフオク落札相場予想価格帯</div>
            <div class="result-value price-highlight" id="res-price">-</div>
        </div>
        
        <div class="result-item">
            <div class="result-label" style="background-color: #e9d8fd; color: #6b46c1;">🔨 ヤフオク出品アドバイス</div>
            <div class="result-value" id="res-yahoo-advice">-</div>
        </div>
        
        <a id="marketBtn" href="#" target="_blank" style="display: none;">📊 ヤフオク落札相場を直接確認</a>
    </div>
</div>

<!-- 出品依頼モーダル -->
<div class="modal" id="exhibitModal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('exhibitModal')">&times;</span>
        <div class="result-title">📦 出品依頼</div>
        
        <div class="result-item">
            <div class="result-label">商品名</div>
            <div class="result-value" id="exhibit-product-name" style="font-weight: bold;">-</div>
        </div>

        <div class="form-group">
            <label>💰 初期出品価格（円）</label>
            <input type="number" id="initialPrice" placeholder="例: 15000">
        </div>
        
        <button class="submit-btn" id="submitExhibitBtn" onclick="submitExhibitRequest()">送信する</button>
    </div>
</div>

<script>
const GAS_SEARCH_URL = "https://script.google.com/macros/s/AKfycbzWTBjlsMk13LvUfiq2pr0PZ2-UPyKD-8Bmi2lc6OFkNckNrBhTsjJKZnqFVb0fV2JR/exec";

let globalLineId = null;
let searchResultsData = [];
let selectedExhibitProductName = "";

// LINE LIFFの初期化
window.onload = function() {
    liff.init({ liffId: "2011480421-iWstUz1i" })
        .then(() => {
            if (liff.isLoggedIn()) {
                return liff.getProfile();
            } else {
                liff.login();
            }
        })
        .then(profile => {
            if (profile) globalLineId = profile.userId;
        })
        .catch(err => console.error("LINE初期化エラー: " + err.toString()));
};

// 検索実行
async function executeSearch() {
    const startDate = document.getElementById('startDate').value;
    const endDate = document.getElementById('endDate').value;
    const keyword = document.getElementById('keyword').value.trim();

    if (!startDate && !endDate && !keyword) {
        alert("期間・日付、または商品名キーワードのどちらかを入力してください。");
        return;
    }

    if (!globalLineId) {
        alert("LINE IDを取得中です。数秒待ってから再度押してください。");
        return;
    }

    document.getElementById('searchBtn').disabled = true;
    document.getElementById('loading').style.display = 'block';
    document.getElementById('resultList').innerHTML = '';

    const payload = {
        lineId: globalLineId,
        startDate: startDate,
        endDate: endDate,
        keyword: keyword,
        action: "search"
    };

    try {
        const res = await fetch(GAS_SEARCH_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
            body: 'data=' + encodeURIComponent(JSON.stringify(payload))
        });
        
        const data = await res.json();
        
        if (data.status === "success") {
            searchResultsData = data.results;
            renderList(data.results);
        } else {
            alert(data.message || "データ取得に失敗しました。");
        }
    } catch (e) {
        alert("エラーが発生しました: " + e.toString());
    } finally {
        document.getElementById('searchBtn').disabled = false;
        document.getElementById('loading').style.display = 'none';
    }
}

// 検索結果リストの表示
function renderList(list) {
    const container = document.getElementById('resultList');
    if (list.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:20px; color:#718096;">該当するデータが見つかりませんでした。</div>';
        return;
    }

    list.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.innerHTML = `
            <div class="item-info">
                <div class="item-date">${item.timestamp}</div>
                <div class="item-title">${item.productName}</div>
            </div>
            <div class="btn-group">
                <button class="detail-btn" onclick="showDetail(${index})">詳細表示</button>
                <button class="exhibit-btn" onclick="showExhibitModal(${index})">出品依頼</button>
            </div>
        `;
        container.appendChild(div);
    });
}

// 詳細表示（モーダル）
function showDetail(index) {
    const item = searchResultsData[index];
    document.getElementById('res-name').innerText = item.productName || "-";
    document.getElementById('res-purchase-advice').innerText = item.purchase_advice || "-";
    document.getElementById('res-price').innerText = item.price_range || "-";
    document.getElementById('res-yahoo-advice').innerText = item.yahoo_advice || "-";

    const mBtn = document.getElementById('marketBtn');
    if (item.searchUrl) {
        mBtn.href = item.searchUrl;
        mBtn.style.display = 'block';
    } else {
        mBtn.style.display = 'none';
    }

    document.getElementById('detailModal').style.display = 'flex';
}

// 出品依頼モーダル表示
function showExhibitModal(index) {
    const item = searchResultsData[index];
    selectedExhibitProductName = item.productName || "";
    document.getElementById('exhibit-product-name').innerText = selectedExhibitProductName;
    document.getElementById('initialPrice').value = '';
    document.getElementById('exhibitModal').style.display = 'flex';
}

// 出品依頼送信処理
async function submitExhibitRequest() {
    const initialPrice = document.getElementById('initialPrice').value.trim();

    if (!initialPrice) {
        alert("初期出品価格を入力してください。");
        return;
    }

    if (!globalLineId) {
        alert("LINE IDを取得できていません。");
        return;
    }

    const btn = document.getElementById('submitExhibitBtn');
    btn.disabled = true;
    btn.innerText = "送信中...";

    const payload = {
        action: "request_exhibit",
        lineId: globalLineId,
        productName: selectedExhibitProductName,
        initialPrice: initialPrice
    };

    try {
        const res = await fetch(GAS_SEARCH_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
            body: 'data=' + encodeURIComponent(JSON.stringify(payload))
        });

        const data = await res.json();

        if (data.status === "success") {
            alert("出品依頼を送信しました。");
            closeModal('exhibitModal');
        } else {
            alert(data.message || "送信に失敗しました。");
        }
    } catch (e) {
        alert("エラーが発生しました: " + e.toString());
    } finally {
        btn.disabled = false;
        btn.innerText = "送信する";
    }
}

// モーダル閉じる
function closeModal(modalId) {
    document.getElementById(modalId).style.display = 'none';
}
</script>
</body>
</html>
